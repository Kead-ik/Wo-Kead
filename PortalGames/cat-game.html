<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Котик-бегун · Ночной город · Кометы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a14;
            --surface: #14142b;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --glass: rgba(20, 20, 45, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 24px;
            --text: #e0e0f0;
            --text-dim: rgba(224, 224, 240, 0.55);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
            touch-action: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 25% 15%, rgba(108, 92, 231, 0.18) 0%, transparent 65%),
                radial-gradient(ellipse at 75% 70%, rgba(0, 206, 201, 0.13) 0%, transparent 60%);
        }

        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 12px;
            width: 100%;
            max-width: 820px;
            height: 100vh;
            max-height: 720px;
            justify-content: center;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            width: 100%;
        }
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 24px 70px rgba(108, 92, 231, 0.25);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--accent2), var(--accent), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo svg {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 0 8px rgba(108, 92, 231, 0.4));
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .score-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-dim);
        }
        .score-item span {
            color: var(--text);
            font-weight: 600;
            min-width: 26px;
            text-align: right;
        }
        .score-item .num {
            color: var(--accent2);
            font-size: 1.1rem;
        }
        .score-item .num.high {
            color: var(--accent3);
        }
        .score-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }
        .btn-menu {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            font-size: 0.7rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.35s ease;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-menu:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }
        .btn-menu svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .canvas-wrap {
            position: relative;
            padding: 8px;
            aspect-ratio: 800 / 400;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
        }
        .canvas-wrap .card {
            padding: 4px;
            border-radius: 20px;
            overflow: hidden;
            height: 100%;
        }
        #gameCanvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 16px;
            background: #0a0a14;
            touch-action: none;
            cursor: pointer;
            image-rendering: auto;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls .hint {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }
        .key-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            font-size: 0.6rem;
            font-weight: 600;
            transition: all 0.35s ease;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .key-btn:hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: var(--accent);
            color: #fff;
            transform: scale(1.08);
        }
        .key-btn:active {
            transform: scale(0.92);
            background: rgba(108, 92, 231, 0.35);
        }
        .key-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
        .btn-restart {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            font-family: inherit;
            touch-action: manipulation;
        }
        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(108, 92, 231, 0.5);
        }
        .btn-restart:active {
            transform: scale(0.95);
        }
        .btn-restart svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        #gameOverlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            border-radius: 20px;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            text-align: center;
            animation: overlayFade 0.6s ease forwards;
        }
        #gameOverlay.show {
            display: flex;
        }
        @keyframes overlayFade {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        #gameOverlay .title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent3), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #gameOverlay .final-score {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent2);
            text-shadow: 0 0 40px rgba(0, 206, 201, 0.25);
        }
        #gameOverlay .final-score small {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-dim);
        }
        .btn-play {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 30px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow: 0 4px 30px rgba(0, 206, 201, 0.3);
            font-family: inherit;
            touch-action: manipulation;
        }
        .btn-play:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 40px rgba(0, 206, 201, 0.5);
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        .btn-play svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 12px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.4);
            animation: toastIn 0.5s ease forwards, toastOut 0.5s ease 2.5s forwards;
            pointer-events: none;
            white-space: nowrap;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
        }

        @media (max-width: 600px) {
            .game-wrapper {
                padding: 6px;
                gap: 10px;
                max-height: 100vh;
                justify-content: flex-start;
                padding-top: 6px;
            }
            .header {
                padding: 10px 14px;
            }
            .logo {
                font-size: 1rem;
            }
            .logo svg {
                width: 24px;
                height: 24px;
            }
            .score-wrap {
                font-size: 0.7rem;
                gap: 10px;
            }
            .score-item svg {
                width: 14px;
                height: 14px;
            }
            .btn-menu {
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .btn-menu svg {
                width: 14px;
                height: 14px;
            }
            .canvas-wrap {
                padding: 4px;
                max-width: 100%;
            }
            .controls {
                padding: 6px 12px 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .controls .hint {
                justify-content: center;
                flex-wrap: wrap;
                font-size: 0.65rem;
                gap: 6px;
            }
            .key-btn {
                width: 32px;
                height: 32px;
                border-radius: 8px;
            }
            .key-btn svg {
                width: 16px;
                height: 16px;
            }
            .btn-restart {
                padding: 5px 12px;
                font-size: 0.65rem;
            }
            .btn-restart svg {
                width: 14px;
                height: 14px;
            }
            #gameOverlay .title {
                font-size: 1.5rem;
            }
            #gameOverlay .final-score {
                font-size: 2rem;
            }
            .btn-play {
                padding: 8px 22px;
                font-size: 0.8rem;
            }
            .toast {
                font-size: 0.8rem;
                padding: 10px 18px;
                white-space: normal;
            }
        }
        @media (max-width: 400px) {
            .header {
                padding: 6px 10px;
            }
            .logo {
                font-size: 0.85rem;
            }
            .score-wrap {
                font-size: 0.6rem;
                gap: 6px;
            }
            .key-btn {
                width: 28px;
                height: 28px;
            }
            .key-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>
    <canvas id="bg-particles"></canvas>

    <div class="game-wrapper">

        <header class="header card">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="14" stroke="#fd79a8" stroke-width="2" opacity="0.3"/>
                    <path d="M12 10 L20 10 L20 18 L12 18 Z" fill="#fd79a8" opacity="0.8"/>
                    <circle cx="14" cy="14" r="1.5" fill="white"/>
                    <circle cx="18" cy="14" r="1.5" fill="white"/>
                    <path d="M14 20 Q16 22 18 20" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M9 12 L11 14 L9 16" stroke="#fd79a8" stroke-width="2" stroke-linecap="round"/>
                    <path d="M23 12 L21 14 L23 16" stroke="#fd79a8" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Котик-бегун</span>
            </div>
            <div class="header-actions">
                <div class="score-wrap">
                    <div class="score-item">
                        <svg viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="7" stroke="#fd79a8" stroke-width="1.8" fill="rgba(253,121,168,0.12)"/>
                            <circle cx="10" cy="10" r="2.5" fill="#fd79a8" opacity="0.7"/>
                            <circle cx="10" cy="10" r="1" fill="#fff" opacity="0.5"/>
                        </svg>
                        <span class="num" id="scoreDisplay">0</span>
                    </div>
                    <div class="score-item">
                        <svg viewBox="0 0 20 20" fill="none">
                            <path d="M6 4H14V10C14 12.209 12.209 14 10 14C7.791 14 6 12.209 6 10V4Z" stroke="#fd79a8" stroke-width="1.6"/>
                            <path d="M4 4H16V6C16 7.657 14.657 9 13 9H7C5.343 9 4 7.657 4 6V4Z" stroke="#fd79a8" stroke-width="1.6"/>
                            <path d="M8 14V17" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M12 14V17" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M6 17H14" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span class="num high" id="highScoreDisplay">0</span>
                    </div>
                </div>
                <a href="index.html" class="btn-menu" id="menuBtn">
                    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3"/><path d="M9 15h6"/></svg>
                    Меню
                </a>
            </div>
        </header>

        <div class="canvas-wrap">
            <div class="card">
                <canvas id="gameCanvas" width="800" height="400"></canvas>
                <div id="gameOverlay">
                    <div class="title">😿 Котик устал</div>
                    <div class="final-score" id="finalScore">0 <small>очков</small></div>
                    <button class="btn-play" id="playAgainBtn">
                        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21 5,3"/></svg>
                        Играть снова
                    </button>
                </div>
            </div>
        </div>

        <div class="controls card">
            <div class="hint">
                <span>Прыжок</span>
                <span class="key-btn" id="jumpBtn" style="width:auto; padding:0 16px; font-size:0.9rem;">
                    <svg viewBox="0 0 24 24" style="width:20px; height:20px;"><polyline points="6,15 12,9 18,15"/></svg>
                </span>
                <span>или <strong>Пробел / Вверх / W / Ц</strong></span>
            </div>
            <button class="btn-restart" id="restartBtn">
                <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                Рестарт
            </button>
        </div>
    </div>

    <script>
        // ===================================================================
        //  0.  ПРОФИЛЬ, ДОСТИЖЕНИЯ, ВРЕМЯ
        // ===================================================================
        let profile = JSON.parse(localStorage.getItem('gamehub_profile')) || { nickname: 'Игрок',
            avatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2240%22 r=%2230%22 fill=%22%23f39c12%22/%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Ccircle cx=%2265%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Cpath d=%22M40 50 Q50 60 60 50%22 stroke=%22%232c3e50%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E' };

        const ACHIEVEMENTS = {
            CAT_FIRST: 'cat_first',
            CAT_MASTER: 'cat_master'
        };

        let unlockedAchievements = JSON.parse(localStorage.getItem('gamehub_achievements') || '[]');
        let totalTime = parseInt(localStorage.getItem('gamehub_totalTime') || '0');
        let sessionStartTime = Date.now();
        let timeUpdateInterval = null;

        function saveTotalTime() {
            if (sessionStartTime) {
                const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                if (elapsed > 0) {
                    totalTime += elapsed;
                    localStorage.setItem('gamehub_totalTime', String(totalTime));
                    sessionStartTime = Date.now();
                }
            }
        }

        function startTimeSaver() {
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            timeUpdateInterval = setInterval(() => {
                if (sessionStartTime) {
                    const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                    if (elapsed > 0) {
                        totalTime += elapsed;
                        localStorage.setItem('gamehub_totalTime', String(totalTime));
                        sessionStartTime = Date.now();
                    }
                }
            }, 5000);
        }

        function unlockAchievement(achId) {
            if (unlockedAchievements.includes(achId)) return false;
            unlockedAchievements.push(achId);
            localStorage.setItem('gamehub_achievements', JSON.stringify(unlockedAchievements));
            let name = '',
                icon = '';
            if (achId === ACHIEVEMENTS.CAT_FIRST) { name = 'Первая прогулка';
                icon = '🐱'; } else if (achId === ACHIEVEMENTS.CAT_MASTER) { name = 'Кот-акробат';
                icon = '🌟'; }
            showToast(`${icon} Достижение разблокировано: ${name}!`);
            return true;
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
        }

        window.addEventListener('beforeunload', () => {
            saveTotalTime();
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
        });

        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.preventDefault();
            saveTotalTime();
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0';
            setTimeout(() => { window.location.href = 'index.html'; }, 400);
        });

        // ===================================================================
        //  1.  BACKGROUND PARTICLES (неоновые точки)
        // ===================================================================
        const bgCanvas = document.getElementById('bg-particles');
        const bgCtx = bgCanvas.getContext('2d');
        let bgW, bgH;
        const bgParticles = [];

        function resizeBg() {
            bgW = window.innerWidth;
            bgH = window.innerHeight;
            bgCanvas.width = bgW;
            bgCanvas.height = bgH;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class BgParticle {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * bgW;
                this.y = Math.random() * bgH;
                this.size = Math.random() * 3 + 1.2;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.25 - 0.05;
                this.opacity = Math.random() * 0.4 + 0.08;
                const colors = ['#6c5ce7', '#00cec9', '#fd79a8', '#a29bfe', '#55efc4'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = Math.random() * 200 + 150;
                this.maxLife = this.life;
                if (!init) { this.x = Math.random() * bgW;
                    this.y = -5; }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
                if (this.life <= 0 || this.y > bgH + 20 || this.x < -20 || this.x > bgW + 20) { this.reset(false); }
            }
            draw(ctx) {
                const alpha = this.opacity * (this.life / this.maxLife);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
                if (this.size > 2) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha * 0.15;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }
        for (let i = 0; i < 85; i++) bgParticles.push(new BgParticle());

        function animateBg() {
            bgCtx.clearRect(0, 0, bgW, bgH);
            for (const p of bgParticles) { p.update();
                p.draw(bgCtx); }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ===================================================================
        //  2.  КОТИК-БЕГУН — НОЧНОЙ ГОРОД + КОМЕТЫ (ПЛАВНЫЙ СПАВН)
        // ===================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800,
            H = 400;
        canvas.width = W;
        canvas.height = H;

        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverlay = document.getElementById('gameOverlay');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const restartBtn = document.getElementById('restartBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        // ----- Состояние -----
        let gameRunning = true;
        let isGameOver = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('catRunnerHigh')) || 0;
        highScoreDisplay.textContent = highScore;

        // Котик
        const cat = {
            x: 80,
            y: 0,
            w: 30,
            h: 30,
            ySpeed: 0,
            grounded: false
        };
        const GROUND_Y = H - 50;
        const GRAVITY = 0.55;
        const JUMP_SPEED = -10.5;

        // Препятствия (водяные гейзеры)
        let obstacles = [];
        const OBSTACLE_W = 20;
        let obsTimer = 0;
        let obsInterval = 90;
        let speed = 4;

        // ----- ГОРОД (динамический спавн) -----
        let buildingsFar = [];
        let buildingsNear = [];

        function generateBuilding(maxHeight, minWidth, maxWidth) {
            return {
                w: minWidth + Math.random() * (maxWidth - minWidth),
                h: 30 + Math.random() * maxHeight,
            };
        }

        function initCity() {
            buildingsFar = [];
            buildingsNear = [];
            // Заполняем на ширину экрана + запас
            let xFar = -100;
            while (xFar < W + 200) {
                const b = generateBuilding(75, 25, 50);
                b.x = xFar;
                buildingsFar.push(b);
                xFar += b.w + 20 + Math.random() * 30;
            }
            let xNear = -100;
            while (xNear < W + 200) {
                const b = generateBuilding(65, 35, 55);
                b.x = xNear;
                buildingsNear.push(b);
                xNear += b.w + 25 + Math.random() * 35;
            }
        }

        function updateCity(speed) {
            // Дальний слой (медленнее)
            const speedFar = speed * 0.25;
            for (let i = buildingsFar.length - 1; i >= 0; i--) {
                const b = buildingsFar[i];
                b.x -= speedFar;
                if (b.x + b.w < -20) {
                    buildingsFar.splice(i, 1);
                }
            }
            // Добавляем новые справа, если последнее здание ушло за правый край
            let lastFar = buildingsFar[buildingsFar.length - 1];
            if (!lastFar || lastFar.x + lastFar.w < W + 20) {
                const xStart = lastFar ? lastFar.x + lastFar.w + 20 + Math.random() * 30 : W + 20;
                let x = xStart;
                while (x < W + 300) {
                    const b = generateBuilding(75, 25, 50);
                    b.x = x;
                    buildingsFar.push(b);
                    x += b.w + 20 + Math.random() * 30;
                }
            }

            // Ближний слой (быстрее)
            const speedNear = speed * 0.6;
            for (let i = buildingsNear.length - 1; i >= 0; i--) {
                const b = buildingsNear[i];
                b.x -= speedNear;
                if (b.x + b.w < -20) {
                    buildingsNear.splice(i, 1);
                }
            }
            let lastNear = buildingsNear[buildingsNear.length - 1];
            if (!lastNear || lastNear.x + lastNear.w < W + 20) {
                const xStart = lastNear ? lastNear.x + lastNear.w + 25 + Math.random() * 35 : W + 20;
                let x = xStart;
                while (x < W + 300) {
                    const b = generateBuilding(65, 35, 55);
                    b.x = x;
                    buildingsNear.push(b);
                    x += b.w + 25 + Math.random() * 35;
                }
            }
        }

        // ----- Луна -----
        let moonAngle = 0;

        // ----- Звёзды -----
        const stars = [];
        for (let i = 0; i < 220; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * (GROUND_Y - 10),
                size: 0.5 + Math.random() * 1.8,
                twinkle: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 1.5
            });
        }

        // ----- КОМЕТЫ -----
        let comets = [];
        let cometTimer = 0;
        const COMET_INTERVAL = 400;

        function spawnComet() {
            const y = 20 + Math.random() * (GROUND_Y * 0.5);
            const fromLeft = Math.random() > 0.5;
            const x = fromLeft ? -20 : W + 20;
            const dx = fromLeft ? (2 + Math.random() * 4) : -(2 + Math.random() * 4);
            const dy = (Math.random() - 0.5) * 1.5;
            const len = 40 + Math.random() * 70;
            const brightness = 0.7 + Math.random() * 0.3;
            comets.push({
                x,
                y,
                dx,
                dy,
                len,
                brightness,
            });
        }

        // ----- Флаги достижений -----
        let achFirst = unlockedAchievements.includes(ACHIEVEMENTS.CAT_FIRST);
        let achMaster = unlockedAchievements.includes(ACHIEVEMENTS.CAT_MASTER);

        // ===== Инициализация =====
        function resetGame() {
            cat.y = GROUND_Y - cat.h;
            cat.ySpeed = 0;
            cat.grounded = true;
            obstacles = [];
            comets = [];
            cometTimer = 0;
            score = 0;
            speed = 4;
            obsInterval = 90;
            obsTimer = 0;
            isGameOver = false;
            gameRunning = true;
            gameOverlay.classList.remove('show');
            gameOverlay.style.display = 'none';
            scoreDisplay.textContent = '0';
            achFirst = unlockedAchievements.includes(ACHIEVEMENTS.CAT_FIRST);
            achMaster = unlockedAchievements.includes(ACHIEVEMENTS.CAT_MASTER);
            initCity();
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            sessionStartTime = Date.now();
            startTimeSaver();
        }

        // ===== Прыжок =====
        function jump() {
            if (!gameRunning || isGameOver) return;
            if (cat.grounded) {
                cat.ySpeed = JUMP_SPEED;
                cat.grounded = false;
            }
        }

        // ===== Обновление =====
        function update() {
            if (!gameRunning || isGameOver) return;

            // Физика
            cat.ySpeed += GRAVITY;
            cat.y += cat.ySpeed;
            if (cat.y >= GROUND_Y - cat.h) {
                cat.y = GROUND_Y - cat.h;
                cat.ySpeed = 0;
                cat.grounded = true;
            } else {
                cat.grounded = false;
            }

            // Препятствия
            obsTimer++;
            if (obsTimer >= obsInterval) {
                obsTimer = 0;
                const h = 18 + Math.random() * 28;
                obstacles.push({
                    x: W,
                    y: GROUND_Y - h,
                    w: OBSTACLE_W,
                    h: h,
                    phase: Math.random() * Math.PI * 2
                });
                obsInterval = Math.max(40, 90 - Math.floor(score / 25) * 2);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= speed;
                if (o.x + o.w < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }
                if (!isGameOver) {
                    const cx = cat.x,
                        cy = cat.y,
                        cw = cat.w,
                        ch = cat.h;
                    if (cx < o.x + o.w && cx + cw > o.x &&
                        cy < o.y + o.h && cy + ch > o.y) {
                        gameOver();
                        return;
                    }
                }
            }

            // Счёт
            score += 0.2;
            scoreDisplay.textContent = Math.floor(score);
            speed = 4 + Math.floor(score / 80) * 0.7;

            // Достижения
            const s = Math.floor(score);
            if (s >= 50 && !achFirst) {
                const unlocked = unlockAchievement(ACHIEVEMENTS.CAT_FIRST);
                if (unlocked) achFirst = true;
            }
            if (s >= 200 && !achMaster) {
                const unlocked = unlockAchievement(ACHIEVEMENTS.CAT_MASTER);
                if (unlocked) achMaster = true;
            }

            // Луна
            moonAngle += 0.005;

            // Город (плавное обновление)
            updateCity(speed);

            // Кометы
            cometTimer++;
            if (cometTimer >= COMET_INTERVAL && Math.random() < 0.3) {
                spawnComet();
                cometTimer = 0;
            } else if (cometTimer >= COMET_INTERVAL + 100) {
                cometTimer = 0;
            }

            for (let i = comets.length - 1; i >= 0; i--) {
                const c = comets[i];
                c.x += c.dx;
                c.y += c.dy;
                if (c.x < -100 || c.x > W + 100 || c.y < -100 || c.y > GROUND_Y + 50) {
                    comets.splice(i, 1);
                }
            }
        }

        // ===== Отрисовка =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- Небо ----
            const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            grad.addColorStop(0, '#050510');
            grad.addColorStop(0.5, '#0a0a20');
            grad.addColorStop(1, '#12122e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // ---- Звёзды ----
            const time = performance.now() / 1000;
            for (const star of stars) {
                const alpha = 0.5 + 0.5 * Math.sin(time * star.speed + star.twinkle);
                ctx.fillStyle = `rgba(255,255,255,${alpha*0.9})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                if (star.size > 1.2) {
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ---- Кометы ----
            for (const c of comets) {
                const headX = c.x;
                const headY = c.y;
                const len = c.len;
                const angle = Math.atan2(c.dy, c.dx);

                const steps = 30;
                for (let i = 0; i < steps; i++) {
                    const t = i / steps;
                    const dist = t * len;
                    const px = headX - Math.cos(angle) * dist;
                    const py = headY - Math.sin(angle) * dist;
                    const alpha = (1 - t) * 0.9 * c.brightness;
                    const size = (1 - t) * 4 + 1;
                    ctx.fillStyle = `rgba(180,220,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowColor = 'rgba(200,230,255,0.8)';
                ctx.shadowBlur = 30;
                ctx.fillStyle = `rgba(255,255,255,${c.brightness})`;
                ctx.beginPath();
                ctx.arc(headX, headY, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(200,230,255,${c.brightness*0.5})`;
                ctx.beginPath();
                ctx.arc(headX, headY, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- Луна ----
            const moonX = W * 0.8;
            const moonY = 70 + 15 * Math.sin(moonAngle);
            const moonRadius = 50;
            const glowGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonRadius * 2.5);
            glowGrad.addColorStop(0, 'rgba(220,220,255,0.12)');
            glowGrad.addColorStop(0.4, 'rgba(200,200,255,0.04)');
            glowGrad.addColorStop(1, 'rgba(200,200,255,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius * 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'rgba(200,200,255,0.4)';
            ctx.shadowBlur = 40;
            const moonGrad = ctx.createRadialGradient(moonX - 15, moonY - 15, 0, moonX, moonY, moonRadius);
            moonGrad.addColorStop(0, '#fffde7');
            moonGrad.addColorStop(0.5, '#f0f0f8');
            moonGrad.addColorStop(1, '#c8c8d8');
            ctx.fillStyle = moonGrad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(180,180,200,0.2)';
            ctx.beginPath();
            ctx.arc(moonX - 18, moonY - 10, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(moonX + 20, moonY + 15, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(moonX + 5, moonY - 25, 6, 0, Math.PI * 2);
            ctx.fill();

            // ---- Город (дальний слой) ----
            for (const b of buildingsFar) {
                const bx = b.x;
                const by = GROUND_Y - b.h;
                ctx.fillStyle = '#14142a';
                ctx.fillRect(bx, by, b.w, b.h);
                ctx.fillStyle = 'rgba(255,200,80,0.7)';
                for (let wy = by + 8; wy < by + b.h - 8; wy += 14) {
                    for (let wx = bx + 6; wx < bx + b.w - 6; wx += 16) {
                        if (Math.random() > 0.3) {
                            ctx.fillRect(wx, wy, 7, 9);
                        }
                    }
                }
            }

            // ---- Город (ближний слой) ----
            for (const b of buildingsNear) {
                const bx = b.x;
                const by = GROUND_Y - b.h;
                ctx.fillStyle = '#0e0e22';
                ctx.fillRect(bx, by, b.w, b.h);
                ctx.fillStyle = 'rgba(255,200,80,0.8)';
                for (let wy = by + 10; wy < by + b.h - 10; wy += 16) {
                    for (let wx = bx + 8; wx < bx + b.w - 8; wx += 18) {
                        if (Math.random() > 0.25) {
                            ctx.fillRect(wx, wy, 8, 10);
                        }
                    }
                }
            }

            // ---- Земля ----
            ctx.fillStyle = '#08081a';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();

            // ---- Водяные гейзеры ----
            const t = performance.now() / 250;
            for (const o of obstacles) {
                const ox = o.x,
                    oy = o.y,
                    ow = o.w,
                    oh = o.h;
                ctx.fillStyle = '#2a2a3a';
                ctx.fillRect(ox, oy + oh - 4, ow, 4);

                const waterHeight = oh + 8 + 10 * Math.sin(t + o.phase);
                const gradWater = ctx.createRadialGradient(ox + ow / 2, oy + oh, 0, ox + ow / 2, oy + oh - waterHeight * 0.4,
                    waterHeight * 0.6);
                gradWater.addColorStop(0, 'rgba(60,150,255,0.6)');
                gradWater.addColorStop(0.4, 'rgba(40,120,255,0.5)');
                gradWater.addColorStop(0.8, 'rgba(20,80,200,0.3)');
                gradWater.addColorStop(1, 'rgba(10,40,120,0)');
                ctx.shadowColor = '#0088ff';
                ctx.shadowBlur = 15;
                ctx.fillStyle = gradWater;
                ctx.beginPath();
                ctx.moveTo(ox - 2, oy + oh);
                ctx.quadraticCurveTo(ox - 4, oy + oh - waterHeight * 0.5, ox + ow / 2, oy + oh - waterHeight);
                ctx.quadraticCurveTo(ox + ow + 4, oy + oh - waterHeight * 0.5, ox + ow + 2, oy + oh);
                ctx.fill();
                ctx.shadowBlur = 0;

                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + t * 0.5 + o.phase;
                    const dist = 10 + 8 * Math.sin(t * 1.3 + i + o.phase);
                    const sx = ox + ow / 2 + Math.cos(angle) * dist;
                    const sy = oy + oh - waterHeight * 0.6 + Math.sin(angle) * dist * 0.4;
                    const sr = 1.5 + Math.random() * 2.5;
                    ctx.fillStyle = `rgba(150,220,255,${0.4+0.4*Math.sin(t*2+i+o.phase)})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (let i = 0; i < 4; i++) {
                    const px = ox + ow / 2 + (Math.random() - 0.5) * ow * 0.8;
                    const py = oy + oh - waterHeight * (0.2 + Math.random() * 0.5) + Math.sin(t * 2 + i + o.phase) * 5;
                    ctx.fillStyle = `rgba(180,230,255,${0.2+0.3*Math.random()})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1 + Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Котик ----
            const cx = cat.x,
                cy = cat.y,
                cw = cat.w,
                ch = cat.h;
            const glowGrad2 = ctx.createRadialGradient(cx + cw / 2, cy + ch / 2, 0, cx + cw / 2, cy + ch / 2, 40);
            glowGrad2.addColorStop(0, 'rgba(255,160,50,0.4)');
            glowGrad2.addColorStop(1, 'rgba(255,160,50,0)');
            ctx.fillStyle = glowGrad2;
            ctx.beginPath();
            ctx.arc(cx + cw / 2, cy + ch / 2, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 30;
            const catColor = '#f39c12';
            ctx.fillStyle = catColor;
            ctx.beginPath();
            ctx.ellipse(cx + cw / 2, cy + ch / 2, cw / 2, ch / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = catColor;
            ctx.beginPath();
            ctx.moveTo(cx + 4, cy + 4);
            ctx.lineTo(cx + 12, cy - 6);
            ctx.lineTo(cx + 16, cy + 4);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx + cw - 4, cy + 4);
            ctx.lineTo(cx + cw - 12, cy - 6);
            ctx.lineTo(cx + cw - 16, cy + 4);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx + 8, cy + 10, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + cw - 8, cy + 10, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(cx + 9, cy + 11, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + cw - 7, cy + 11, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(cx + cw / 2, cy + 16, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1.5;
            for (let side = -1; side <= 1; side += 2) {
                const baseX = cx + (side > 0 ? cw : 0);
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(baseX, cy + 14 + i * 4);
                    ctx.lineTo(baseX + side * 14, cy + 12 + i * 5);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;

            // ---- Счёт ----
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = 'bold 18px Segoe UI, sans-serif';
            ctx.fillText(`🏃 ${Math.floor(score)}`, 20, 35);
        }

        // ===== Game Over =====
        function gameOver() {
            if (isGameOver) return;
            isGameOver = true;
            gameRunning = false;
            const s = Math.floor(score);
            if (s > highScore) {
                highScore = s;
                localStorage.setItem('catRunnerHigh', String(highScore));
                highScoreDisplay.textContent = highScore;
            }
            saveTotalTime();
            finalScoreEl.innerHTML = `${s} <small>очков</small>`;
            gameOverlay.style.display = 'flex';
            void gameOverlay.offsetWidth;
            gameOverlay.classList.add('show');
        }

        // ===== Game Loop =====
        let lastTime = 0;
        let accumulator = 0;
        const step = 1000 / 60;

        function gameLoop(time) {
            const delta = time - lastTime;
            lastTime = time;
            if (!isGameOver && gameRunning) {
                accumulator += delta;
                while (accumulator >= step) {
                    update();
                    accumulator -= step;
                }
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ===== УПРАВЛЕНИЕ =====
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === ' ' || key === 'Space' || key === 'ArrowUp' || key === 'w' || key === 'W' || key === 'ц' || key ===
                'Ц') {
                e.preventDefault();
                jump();
            }
            if (key === 'r' || key === 'R') {
                if (isGameOver) resetGame();
            }
        });

        jumpBtn.addEventListener('click', (e) => { e.preventDefault();
            jump(); });
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault();
            jump(); }, { passive: false });

        canvas.addEventListener('click', () => { jump(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault();
            jump(); }, { passive: false });

        playAgainBtn.addEventListener('click', () => { resetGame(); });
        restartBtn.addEventListener('click', () => { resetGame(); });

        // ===== СТАРТ =====
        resetGame();
        requestAnimationFrame(gameLoop);

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.floor(rect.width - 10);
            const dim = Math.min(size, 780);
            canvas.style.width = dim + 'px';
            canvas.style.height = (dim * 0.5) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        console.log('🌙 Котик-бегун · Ночной город · Кометы');
        console.log('☄️ Изредка пролетают кометы с хвостом');
        console.log('🏙️ Плавный параллакс города без видимых скачков');
        console.log('🏆 Достижения: 50 → "Первая прогулка", 200 → "Кот-акробат"');
    </script>
</body>
