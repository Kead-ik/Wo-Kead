<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortalGames</title>
    <style>
        :root {
            --bg: #0a0a14;
            --surface: #14142b;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --text: #e0e0f0;
            --text2: #a0a0c0;
            --glass: rgba(20, 20, 45, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 206, 201, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(253, 121, 168, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        body.fade-in { opacity: 1; }

        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; border-radius: 50%; background: white; animation: floatUp linear infinite;
            opacity: 0.7;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.7); opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0.9; }
        }

        .app-container {
            position: relative; z-index: 1; width: 100%; max-width: 800px; padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header .logo {
            font-size: 3rem; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            animation: logoShimmer 4s ease-in-out infinite; background-size: 200% 200%;
            display: inline-block;
        }
        @keyframes logoShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .user-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .profile-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 10px 24px;
            cursor: pointer;
            transition: all 0.35s;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .profile-btn:hover {
            background: rgba(108,92,231,0.15);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(108,92,231,0.4);
            transform: translateY(-2px);
        }
        .profile-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #2c3e50;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--accent);
            flex-shrink: 0;
        }
        .profile-nick {
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .games-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .game-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 22px;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
            flex: 0 1 220px;
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(108,92,231,0.3), 0 0 0 1px rgba(255,255,255,0.1) inset;
        }
        .game-card:active { transform: scale(0.96); }

        /* CSS-иконки */
        .icon-cat, .icon-snake, .icon-tetris, .icon-tic-tac-toe, .icon-tricky-towers {
            width: 70px; height: 70px; position: relative; display: inline-block;
        }
        .icon-cat .cat-body {
            position: absolute; width: 44px; height: 28px; background: #f39c12; border-radius: 50% 50% 45% 45%;
            left: 13px; top: 24px; box-shadow: 0 4px 0 #d68910;
            animation: catBounce 2s infinite ease-in-out;
        }
        .icon-cat .cat-head {
            position: absolute; width: 32px; height: 28px; background: #f39c12; border-radius: 50%;
            left: 19px; top: 4px; z-index: 1;
        }
        .icon-cat .ear-left, .icon-cat .ear-right {
            position: absolute; width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #f39c12;
            z-index: 0;
        }
        .icon-cat .ear-left { left: 15px; top: -2px; transform: rotate(-20deg); }
        .icon-cat .ear-right { left: 35px; top: -2px; transform: rotate(20deg); }
        .icon-cat .eyes {
            position: absolute; width: 6px; height: 8px; background: #2c3e50; border-radius: 50%;
            left: 25px; top: 14px; box-shadow: 10px 0 0 #2c3e50; z-index: 2;
            animation: blink 3s infinite;
        }
        .icon-cat .tail {
            position: absolute; width: 20px; height: 6px; background: #d68910; border-radius: 0 10px 10px 0;
            left: 50px; top: 38px; transform-origin: left center;
            animation: tailWag 1.5s infinite ease-in-out;
        }
        @keyframes catBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes tailWag {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }
        @keyframes blink {
            0%,90%,100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .icon-snake .snake-body {
            position: absolute; width: 50px; height: 10px; background: #00cec9; border-radius: 20px;
            left: 10px; top: 30px; animation: snakeMove 2s infinite alternate ease-in-out;
            box-shadow: 0 0 10px #00cec9;
        }
        .icon-snake .snake-head {
            position: absolute; width: 20px; height: 16px; background: #0984e3; border-radius: 10px 10px 4px 4px;
            left: 52px; top: 26px; box-shadow: -2px 0 0 #00cec9;
            animation: snakeHead 2s infinite alternate ease-in-out;
        }
        .icon-snake .snake-eye {
            position: absolute; width: 5px; height: 5px; background: #fff; border-radius: 50%;
            left: 62px; top: 30px; box-shadow: 2px 0 0 #000;
        }
        @keyframes snakeMove {
            0% { transform: translateX(0) rotate(-10deg); }
            100% { transform: translateX(6px) rotate(5deg); }
        }
        @keyframes snakeHead {
            0% { transform: translateX(0); }
            100% { transform: translateX(6px); }
        }

        .icon-tetris .block {
            position: absolute; width: 18px; height: 18px; border-radius: 3px;
            animation: tetrisFloat 2s infinite ease-in-out;
        }
        .icon-tetris .b1 { background: #e74c3c; left: 8px; top: 6px; }
        .icon-tetris .b2 { background: #3498db; left: 28px; top: 6px; }
        .icon-tetris .b3 { background: #2ecc71; left: 8px; top: 26px; }
        .icon-tetris .b4 { background: #f1c40f; left: 28px; top: 26px; }
        @keyframes tetrisFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .icon-tic-tac-toe {
            width: 70px; height: 70px; position: relative; display: flex; align-items: center; justify-content: center;
        }
        .icon-tic-tac-toe .x-mark, .icon-tic-tac-toe .o-mark {
            position: absolute; font-size: 32px; font-weight: bold;
        }
        .icon-tic-tac-toe .x-mark {
            color: #e74c3c; left: 8px; top: 6px; transform: rotate(15deg);
            animation: xFloat 1.5s infinite alternate;
        }
        .icon-tic-tac-toe .o-mark {
            color: #3498db; right: 8px; bottom: 6px; transform: rotate(-10deg);
            animation: oFloat 1.5s infinite alternate;
        }
        @keyframes xFloat {
            0% { transform: rotate(15deg) translateY(0); }
            100% { transform: rotate(15deg) translateY(-3px); }
        }
        @keyframes oFloat {
            0% { transform: rotate(-10deg) translateY(0); }
            100% { transform: rotate(-10deg) translateY(3px); }
        }

        /* Иконка Tricky Towers */
        .icon-tricky-towers {
            width: 70px; height: 70px; position: relative; display: flex; align-items: center; justify-content: center;
        }
        .icon-tricky-towers .block {
            position: absolute; width: 22px; height: 16px; border-radius: 4px;
            animation: towerFloat 2s infinite ease-in-out;
        }
        .icon-tricky-towers .b1 { background: #9b59b6; bottom: 10px; left: 8px; animation-delay: 0s; }
        .icon-tricky-towers .b2 { background: #f1c40f; bottom: 22px; left: 24px; animation-delay: 0.2s; }
        .icon-tricky-towers .b3 { background: #e74c3c; bottom: 10px; right: 8px; animation-delay: 0.4s; }
        .icon-tricky-towers .b4 { background: #2ecc71; bottom: 34px; left: 16px; width: 28px; animation-delay: 0.6s; }
        .icon-tricky-towers .b5 { background: #3498db; bottom: 46px; left: 22px; width: 16px; animation-delay: 0.8s; border-radius: 8px 8px 2px 2px; }
        @keyframes towerFloat {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(2deg); }
        }

        .game-title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        .game-desc { font-size: 0.8rem; color: var(--text2); line-height: 1.4; }
        .game-badge {
            display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        }
        .badge-cat { background: rgba(243,156,18,0.3); color: #f39c12; border: 1px solid rgba(243,156,18,0.4); }
        .badge-snake { background: rgba(0,206,201,0.25); color: #80f0ec; border: 1px solid rgba(0,206,201,0.4); }
        .badge-tetris { background: rgba(231,76,60,0.25); color: #e74c3c; border: 1px solid rgba(231,76,60,0.4); }
        .badge-tic-tac-toe { background: rgba(52,152,219,0.25); color: #3498db; border: 1px solid rgba(52,152,219,0.4); }
        .badge-tricky-towers { background: rgba(155,89,182,0.25); color: #9b59b6; border: 1px solid rgba(155,89,182,0.4); }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="app-container">
    <div class="header">
        <div class="logo">GameHub</div>
    </div>

    <div class="user-bar">
        <a class="profile-btn" href="profile.html" id="profileLink">
            <div class="profile-avatar" id="menuAvatar"></div>
            <span class="profile-nick" id="menuNick">Игрок</span>
        </a>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
</div>

<script>
    (function() {
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
            loadProfileData();
            renderAllCards();
        });

        // Фоновые частицы
        const pc = document.getElementById('particles');
        for (let i=0; i<55; i++) {
            const p = document.createElement('div'); p.className='particle';
            p.style.left=Math.random()*100+'%'; p.style.width=p.style.height=Math.random()*5+2+'px';
            p.style.background=['#6c5ce7','#00cec9','#fd79a8','#ffeaa7','#fff'][Math.floor(Math.random()*5)];
            p.style.animationDuration=Math.random()*15+10+'s'; p.style.animationDelay=Math.random()*12+'s';
            pc.appendChild(p);
        }

        function loadProfileData() {
            const profile = JSON.parse(localStorage.getItem('gamehub_profile')) || {
                nickname: 'Игрок',
                avatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2240%22 r=%2230%22 fill=%22%23f39c12%22/%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Ccircle cx=%2265%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Cpath d=%22M40 50 Q50 60 60 50%22 stroke=%22%232c3e50%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E'
            };
            document.getElementById('menuAvatar').style.backgroundImage = `url(${profile.avatar})`;
            document.getElementById('menuNick').textContent = profile.nickname;
        }

        const customGames = [];

        window.addCustomGameCard = function({ title, url, description, iconHTML, badgeText, badgeClass } = {}) {
            if (!title || !url) {
                console.error('Ошибка: обязательно укажите title и url');
                return;
            }
            customGames.push({
                title,
                url,
                description: description || 'Новая игра',
                iconHTML: iconHTML || '<div class="icon-default">🎲</div>',
                badgeText: badgeText || null,
                badgeClass: badgeClass || ''
            });
            renderAllCards();
        };

        function renderAllCards() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            const builtin = [
                {
                    title: 'Котик-прыгун',
                    desc: 'Прыгай через заборчики в городе!',
                    url: 'cat-game.html',
                    icon: `<div class="icon-cat"><div class="ear-left"></div><div class="ear-right"></div><div class="cat-head"></div><div class="cat-body"></div><div class="eyes"></div><div class="tail"></div></div>`,
                    badge: 'Аркада',
                    badgeClass: 'badge-cat'
                },
                {
                    title: 'Змейка',
                    desc: 'Собирай фрукты и расти!',
                    url: 'snake-game.html',
                    icon: `<div class="icon-snake"><div class="snake-body"></div><div class="snake-head"></div><div class="snake-eye"></div></div>`,
                    badge: 'Классика',
                    badgeClass: 'badge-snake'
                },
                {
                    title: 'Тетрис',
                    desc: 'Складывай фигуры и бей рекорды!',
                    url: 'tetris-game.html',
                    icon: `<div class="icon-tetris"><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div><div class="block b4"></div></div>`,
                    badge: 'Головоломка',
                    badgeClass: 'badge-tetris'
                },
                {
                    title: 'Крестики-нолики',
                    desc: 'Классическая битва X против O!',
                    url: 'tictactoe-game.html',
                    icon: `<div class="icon-tic-tac-toe"><span class="x-mark">✕</span><span class="o-mark">◯</span></div>`,
                    badge: 'Логика',
                    badgeClass: 'badge-tic-tac-toe'
                },
                // НОВАЯ КАРТОЧКА Tricky Towers
                {
                    title: 'Tricky Towers',
                    desc: 'Построй свою башню, собирая бонусы!',
                    url: 'tricky-towers.html',
                    icon: `<div class="icon-tricky-towers">
                        <div class="block b1"></div>
                        <div class="block b2"></div>
                        <div class="block b3"></div>
                        <div class="block b4"></div>
                        <div class="block b5"></div>
                    </div>`,
                    badge: 'Башни',
                    badgeClass: 'badge-tricky-towers'
                }
            ];

            const allGames = [...builtin, ...customGames];

            allGames.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = game.url;
                card.innerHTML = `
                    ${game.icon || game.iconHTML}
                    <div class="game-title">${game.title}</div>
                    <div class="game-desc">${game.description || game.desc}</div>
                    ${game.badge ? `<span class="game-badge ${game.badgeClass || ''}">${game.badge}</span>` : (game.badgeText ? `<span class="game-badge ${game.badgeClass || ''}">${game.badgeText}</span>` : '')}
                `;
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = this.href; }, 400);
                });
                grid.appendChild(card);
            });
        }

        const style = document.createElement('style');
        style.textContent = `body.fade-out { opacity: 0; transition: opacity 0.4s ease; }`;
        document.head.appendChild(style);

        document.getElementById('profileLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => { window.location.href = this.href; }, 400);
        });
    })();
</script>
</body>
</html>
