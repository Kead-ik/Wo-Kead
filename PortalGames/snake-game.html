<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Неоновая Змейка · Профиль + Достижения</title>
    <style>
        /* ===== RESET & ROOT ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0a0a14;
            --surface: #14142b;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --glass: rgba(20, 20, 45, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 24px;
            --text: #e0e0f0;
            --text-dim: rgba(224, 224, 240, 0.55);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
            touch-action: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 25% 15%, rgba(108, 92, 231, 0.18) 0%, transparent 65%),
                radial-gradient(ellipse at 75% 70%, rgba(0, 206, 201, 0.13) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(253, 121, 168, 0.06) 0%, transparent 70%);
        }

        /* ===== BACKGROUND PARTICLES ===== */
        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== MAIN WRAPPER ===== */
        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 12px;
            width: 100%;
            max-width: 620px;
            height: 100vh;
            max-height: 840px;
            justify-content: center;
        }

        /* ===== GLASS CARD ===== */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: transform var(--transition), box-shadow var(--transition);
            width: 100%;
        }
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 24px 70px rgba(108, 92, 231, 0.25);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent2), var(--accent), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo svg {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(108, 92, 231, 0.4));
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .score-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-dim);
        }
        .score-item span {
            color: var(--text);
            font-weight: 600;
            min-width: 26px;
            text-align: right;
        }
        .score-item .num {
            color: var(--accent2);
            font-size: 1.1rem;
        }
        .score-item .num.high {
            color: var(--accent3);
        }
        .score-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .btn-menu {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            font-size: 0.7rem;
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition);
            cursor: pointer;
            font-family: inherit;
        }
        .btn-menu:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }
        .btn-menu svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== GAME CANVAS ===== */
        .canvas-wrap {
            position: relative;
            padding: 8px;
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }
        .canvas-wrap .card {
            width: 100%;
            height: 100%;
            padding: 4px;
            border-radius: 20px;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.45);
            image-rendering: auto;
            touch-action: none;
            cursor: pointer;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px 14px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls .hint {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.02em;
            flex-wrap: wrap;
        }
        .key-group {
            display: flex;
            gap: 4px;
        }
        .key-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            font-size: 0.6rem;
            font-weight: 600;
            transition: all var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .key-btn:hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: var(--accent);
            color: #fff;
            transform: scale(1.08);
        }
        .key-btn:active {
            transform: scale(0.92);
            background: rgba(108, 92, 231, 0.35);
        }
        .key-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
        .btn-restart {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            font-family: inherit;
            touch-action: manipulation;
        }
        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(108, 92, 231, 0.5);
        }
        .btn-restart:active {
            transform: scale(0.95);
        }
        .btn-restart svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* ===== GAME OVER OVERLAY ===== */
        #gameOverlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            border-radius: 20px;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            text-align: center;
            animation: overlayFade 0.6s ease forwards;
        }
        #gameOverlay.show {
            display: flex;
        }
        @keyframes overlayFade {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        #gameOverlay .title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent3), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        #gameOverlay .sub {
            color: var(--text-dim);
            font-size: 0.95rem;
            max-width: 280px;
            line-height: 1.5;
        }
        #gameOverlay .final-score {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent2);
            text-shadow: 0 0 40px rgba(0, 206, 201, 0.25);
        }
        #gameOverlay .final-score small {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-dim);
        }
        .btn-play {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 30px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 30px rgba(0, 206, 201, 0.3);
            font-family: inherit;
            margin-top: 4px;
            touch-action: manipulation;
        }
        .btn-play:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 40px rgba(0, 206, 201, 0.5);
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        .btn-play svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        /* ===== SHATTER CANVAS ===== */
        #shatterCanvas {
            position: absolute;
            inset: 0;
            z-index: 15;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            pointer-events: none;
            display: none;
        }
        #shatterCanvas.active {
            display: block;
        }

        /* ===== TOAST (уведомление о достижении) ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 12px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.4);
            animation: toastIn 0.5s ease forwards, toastOut 0.5s ease 2.5s forwards;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast .icon {
            margin-right: 8px;
        }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(-30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.9); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .game-wrapper {
                padding: 6px;
                gap: 10px;
                max-height: 100vh;
                justify-content: flex-start;
                padding-top: 6px;
            }
            .header {
                padding: 10px 14px;
                gap: 6px;
            }
            .logo {
                font-size: 1rem;
            }
            .logo svg {
                width: 24px;
                height: 24px;
            }
            .score-wrap {
                font-size: 0.7rem;
                gap: 10px;
            }
            .score-item svg {
                width: 14px;
                height: 14px;
            }
            .btn-menu {
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .btn-menu svg {
                width: 14px;
                height: 14px;
            }
            .canvas-wrap {
                padding: 4px;
                max-width: 100%;
            }
            .controls {
                padding: 6px 12px 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .controls .hint {
                justify-content: center;
                flex-wrap: wrap;
                font-size: 0.65rem;
                gap: 6px;
            }
            .key-btn {
                width: 32px;
                height: 32px;
                border-radius: 8px;
            }
            .key-btn svg {
                width: 16px;
                height: 16px;
            }
            .btn-restart {
                padding: 5px 12px;
                font-size: 0.65rem;
            }
            .btn-restart svg {
                width: 14px;
                height: 14px;
            }
            #gameOverlay .title {
                font-size: 1.5rem;
            }
            #gameOverlay .final-score {
                font-size: 2rem;
            }
            .btn-play {
                padding: 8px 22px;
                font-size: 0.8rem;
            }
            .toast {
                font-size: 0.8rem;
                padding: 10px 18px;
                white-space: normal;
            }
        }
        @media (max-width: 400px) {
            .header {
                padding: 6px 10px;
            }
            .logo {
                font-size: 0.85rem;
            }
            .score-wrap {
                font-size: 0.6rem;
                gap: 6px;
            }
            .key-btn {
                width: 28px;
                height: 28px;
            }
            .key-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== BACKGROUND PARTICLES ===== -->
    <canvas id="bg-particles"></canvas>

    <!-- ===== GAME WRAPPER ===== -->
    <div class="game-wrapper">

        <!-- HEADER -->
        <header class="header card">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 4C12 4 8 6 8 10V18C8 22 12 24 16 24C20 24 24 22 24 18V14" stroke="url(#snakeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="16" cy="10" r="2" fill="#6c5ce7" stroke="#6c5ce7" stroke-width="1.5"/>
                    <circle cx="20" cy="14" r="1.5" fill="#00cec9" stroke="#00cec9" stroke-width="1.2"/>
                    <circle cx="12" cy="14" r="1.5" fill="#fd79a8" stroke="#fd79a8" stroke-width="1.2"/>
                    <circle cx="16" cy="18" r="1.5" fill="#6c5ce7" stroke="#6c5ce7" stroke-width="1.2"/>
                    <circle cx="20" cy="18" r="1.5" fill="#00cec9" stroke="#00cec9" stroke-width="1.2"/>
                    <circle cx="12" cy="18" r="1.5" fill="#fd79a8" stroke="#fd79a8" stroke-width="1.2"/>
                    <circle cx="8" cy="10" r="1" fill="#fff" opacity="0.6"/>
                    <circle cx="10" cy="8" r="1" fill="#fff" opacity="0.4"/>
                    <defs>
                        <linearGradient id="snakeGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#6c5ce7"/>
                            <stop offset="50%" stop-color="#00cec9"/>
                            <stop offset="100%" stop-color="#fd79a8"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span>Неоновая Змейка</span>
            </div>
            <div class="header-actions">
                <div class="score-wrap">
                    <div class="score-item">
                        <svg viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="7" stroke="#fd79a8" stroke-width="1.8" fill="rgba(253,121,168,0.12)"/>
                            <circle cx="10" cy="10" r="2.5" fill="#fd79a8" opacity="0.7"/>
                            <circle cx="10" cy="10" r="1" fill="#fff" opacity="0.5"/>
                        </svg>
                        <span class="num" id="scoreDisplay">0</span>
                    </div>
                    <div class="score-item">
                        <svg viewBox="0 0 20 20" fill="none">
                            <path d="M6 4H14V10C14 12.209 12.209 14 10 14C7.791 14 6 12.209 6 10V4Z" stroke="#fd79a8" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M4 4H16V6C16 7.657 14.657 9 13 9H7C5.343 9 4 7.657 4 6V4Z" stroke="#fd79a8" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M8 14V17" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M12 14V17" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M6 17H14" stroke="#fd79a8" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span class="num high" id="highScoreDisplay">0</span>
                    </div>
                </div>
                <a href="index.html" class="btn-menu" id="menuBtn">
                    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3"/><path d="M9 15h6"/></svg>
                    Меню
                </a>
            </div>
        </header>

        <!-- GAME CANVAS -->
        <div class="canvas-wrap">
            <div class="card">
                <canvas id="gameCanvas" width="500" height="500"></canvas>
                <canvas id="shatterCanvas" width="500" height="500"></canvas>
                <div id="gameOverlay">
                    <div class="title">💥 Игра окончена</div>
                    <div class="final-score" id="finalScore">0 <small>очков</small></div>
                    <div class="sub">Ваша змейка разбилась на осколки...</div>
                    <button class="btn-play" id="playAgainBtn">
                        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21 5,3"/></svg>
                        Играть снова
                    </button>
                </div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls card">
            <div class="hint">
                <span>Управление</span>
                <div class="key-group" id="arrowKeys">
                    <button class="key-btn" data-dx="0" data-dy="-1" aria-label="Вверх">
                        <svg viewBox="0 0 24 24"><polyline points="18,15 12,9 6,15"/></svg>
                    </button>
                    <button class="key-btn" data-dx="0" data-dy="1" aria-label="Вниз">
                        <svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
                    </button>
                    <button class="key-btn" data-dx="-1" data-dy="0" aria-label="Влево">
                        <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
                    </button>
                    <button class="key-btn" data-dx="1" data-dy="0" aria-label="Вправо">
                        <svg viewBox="0 0 24 24"><polyline points="9,6 15,12 9,18"/></svg>
                    </button>
                </div>
                <span>или <strong>WASD / ЦФЫВ</strong></span>
            </div>
            <button class="btn-restart" id="restartBtn">
                <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                Рестарт
            </button>
        </div>
    </div>

    <script>
        // ===================================================================
        //  0.  ПРОФИЛЬ, ДОСТИЖЕНИЯ, ВРЕМЯ — ИНТЕГРАЦИЯ
        // ===================================================================

        let profile = JSON.parse(localStorage.getItem('gamehub_profile')) || {
            nickname: 'Игрок',
            avatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2240%22 r=%2230%22 fill=%22%23f39c12%22/%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Ccircle cx=%2265%22 cy=%2235%22 r=%224%22 fill=%22%232c3e50%22/%3E%3Cpath d=%22M40 50 Q50 60 60 50%22 stroke=%22%232c3e50%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E'
        };

        const ACHIEVEMENTS = {
            SNAKE_FIRST: 'snake_first',
            SNAKE_MASTER: 'snake_master'
        };

        let unlockedAchievements = JSON.parse(localStorage.getItem('gamehub_achievements') || '[]');
        let totalTime = parseInt(localStorage.getItem('gamehub_totalTime') || '0');
        let sessionStartTime = Date.now();
        let timeUpdateInterval = null;

        function saveTotalTime() {
            if (sessionStartTime) {
                const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                if (elapsed > 0) {
                    totalTime += elapsed;
                    localStorage.setItem('gamehub_totalTime', String(totalTime));
                    sessionStartTime = Date.now();
                }
            }
        }

        function startTimeSaver() {
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            timeUpdateInterval = setInterval(() => {
                if (sessionStartTime) {
                    const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                    if (elapsed > 0) {
                        totalTime += elapsed;
                        localStorage.setItem('gamehub_totalTime', String(totalTime));
                        sessionStartTime = Date.now();
                    }
                }
            }, 5000);
        }

        function unlockAchievement(achId) {
            if (unlockedAchievements.includes(achId)) return false;
            unlockedAchievements.push(achId);
            localStorage.setItem('gamehub_achievements', JSON.stringify(unlockedAchievements));
            let name = '';
            let icon = '';
            if (achId === ACHIEVEMENTS.SNAKE_FIRST) {
                name = 'Змеиный укус';
                icon = '🐍';
            } else if (achId === ACHIEVEMENTS.SNAKE_MASTER) {
                name = 'Удав';
                icon = '👑';
            }
            showToast(`${icon} Достижение разблокировано: ${name}!`);
            return true;
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3000);
        }

        window.addEventListener('beforeunload', () => {
            saveTotalTime();
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
        });

        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.preventDefault();
            saveTotalTime();
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 400);
        });

        // ===================================================================
        //  1.  BACKGROUND PARTICLES
        // ===================================================================
        const bgCanvas = document.getElementById('bg-particles');
        const bgCtx = bgCanvas.getContext('2d');
        let bgW, bgH;
        const bgParticles = [];

        function resizeBg() {
            bgW = window.innerWidth;
            bgH = window.innerHeight;
            bgCanvas.width = bgW;
            bgCanvas.height = bgH;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class BgParticle {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * bgW;
                this.y = Math.random() * bgH;
                this.size = Math.random() * 3 + 1.2;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.25 - 0.05;
                this.opacity = Math.random() * 0.4 + 0.08;
                const colors = ['#6c5ce7', '#00cec9', '#fd79a8', '#a29bfe', '#55efc4'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = Math.random() * 200 + 150;
                this.maxLife = this.life;
                if (!init) {
                    this.x = Math.random() * bgW;
                    this.y = -5;
                }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
                if (this.life <= 0 || this.y > bgH + 20 || this.x < -20 || this.x > bgW + 20) {
                    this.reset(false);
                }
            }
            draw(ctx) {
                const alpha = this.opacity * (this.life / this.maxLife);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
                if (this.size > 2) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha * 0.15;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        for (let i = 0; i < 85; i++) {
            bgParticles.push(new BgParticle());
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgW, bgH);
            for (const p of bgParticles) {
                p.update();
                p.draw(bgCtx);
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ===================================================================
        //  2.  SNAKE GAME — SMOOTH + ACHIEVEMENTS + TIME
        // ===================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const shatterCanvas = document.getElementById('shatterCanvas');
        const shatterCtx = shatterCanvas.getContext('2d');

        const CANVAS_SIZE = 500;
        const GRID_SIZE = 20;
        const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        shatterCanvas.width = CANVAS_SIZE;
        shatterCanvas.height = CANVAS_SIZE;

        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverlay = document.getElementById('gameOverlay');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const restartBtn = document.getElementById('restartBtn');

        let snake = [];
        let food = { x: 10, y: 10 };
        let direction = { dx: 1, dy: 0 };
        let nextDirection = { dx: 1, dy: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neonSnakeHigh')) || 0;
        let gameRunning = true;
        let isGameOver = false;
        let shatterActive = false;

        let headHistory = [];
        const MAX_HISTORY = 200;

        let stepInterval = 130; // уменьшили для отзывчивости
        let baseSpeed = 130;
        let lastTimestamp = 0;
        let accumulator = 0;
        let animationId = null;

        let achievementNotifiedFirst = false;
        let achievementNotifiedMaster = false;

        function spawnFood() {
            const maxAttempts = 1000;
            for (let i = 0; i < maxAttempts; i++) {
                const fx = Math.floor(Math.random() * GRID_SIZE);
                const fy = Math.floor(Math.random() * GRID_SIZE);
                if (!snake.some(s => s.x === fx && s.y === fy)) {
                    food = { x: fx, y: fy };
                    return;
                }
            }
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (!snake.some(s => s.x === x && s.y === y)) {
                        food = { x, y };
                        return;
                    }
                }
            }
            gameOver(false);
        }

        function checkAchievements() {
            if (score >= 30 && !achievementNotifiedFirst) {
                const unlocked = unlockAchievement(ACHIEVEMENTS.SNAKE_FIRST);
                if (unlocked) achievementNotifiedFirst = true;
            }
            if (score >= 150 && !achievementNotifiedMaster) {
                const unlocked = unlockAchievement(ACHIEVEMENTS.SNAKE_MASTER);
                if (unlocked) achievementNotifiedMaster = true;
            }
        }

        function initGame() {
            const mid = Math.floor(GRID_SIZE / 2);
            snake = [
                { x: mid, y: mid },
                { x: mid - 1, y: mid },
                { x: mid - 2, y: mid }
            ];
            direction = { dx: 1, dy: 0 };
            nextDirection = { dx: 1, dy: 0 };
            score = 0;
            stepInterval = baseSpeed;
            isGameOver = false;
            shatterActive = false;
            gameRunning = true;
            achievementNotifiedFirst = unlockedAchievements.includes(ACHIEVEMENTS.SNAKE_FIRST);
            achievementNotifiedMaster = unlockedAchievements.includes(ACHIEVEMENTS.SNAKE_MASTER);
            scoreDisplay.textContent = '0';
            gameOverlay.classList.remove('show');
            gameOverlay.style.display = 'none';
            shatterCanvas.classList.remove('active');
            shatterCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const head = snake[0];
            headHistory = [];
            for (let i = 0; i < 20; i++) {
                headHistory.push({
                    x: head.x * CELL_SIZE + CELL_SIZE / 2,
                    y: head.y * CELL_SIZE + CELL_SIZE / 2
                });
            }
            spawnFood();
            accumulator = 0;
            lastTimestamp = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop(performance.now());

            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            sessionStartTime = Date.now();
            startTimeSaver();
        }

        function updateGame() {
            if (!gameRunning || isGameOver || shatterActive) return;

            if ((nextDirection.dx !== 0 || nextDirection.dy !== 0) &&
                (nextDirection.dx !== -direction.dx || nextDirection.dy !== -direction.dy)) {
                direction = { dx: nextDirection.dx, dy: nextDirection.dy };
            }

            const head = snake[0];
            const newHead = {
                x: head.x + direction.dx,
                y: head.y + direction.dy
            };

            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                gameOver(false);
                return;
            }

            const ate = (newHead.x === food.x && newHead.y === food.y);

            let newSnake = [newHead, ...snake];
            if (!ate) {
                newSnake.pop();
            }

            const headCollision = newSnake.slice(1).some(seg => seg.x === newHead.x && seg.y === newHead.y);
            if (headCollision) {
                gameOver(false);
                return;
            }

            snake = newSnake;

            const headPixel = {
                x: newHead.x * CELL_SIZE + CELL_SIZE / 2,
                y: newHead.y * CELL_SIZE + CELL_SIZE / 2
            };
            headHistory.push(headPixel);
            const needed = snake.length + 2;
            while (headHistory.length > needed) {
                headHistory.shift();
            }

            if (ate) {
                score++;
                scoreDisplay.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonSnakeHigh', String(highScore));
                    highScoreDisplay.textContent = highScore;
                }
                checkAchievements();
                spawnFood();
                updateSpeed();
            }
        }

        function updateSpeed() {
            const newSpeed = Math.max(60, baseSpeed - Math.floor(score / 5) * 4);
            if (newSpeed !== stepInterval) {
                stepInterval = newSpeed;
            }
        }

        function draw(progress) {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Food
            const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
            const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
            const pulse = 1 + 0.12 * Math.sin(performance.now() / 300);
            const fr = (CELL_SIZE / 2) * 0.7 * pulse;

            const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 3);
            grad.addColorStop(0, 'rgba(253,121,168,0.5)');
            grad.addColorStop(0.5, 'rgba(253,121,168,0.15)');
            grad.addColorStop(1, 'rgba(253,121,168,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(fx, fy, fr * 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#fd79a8';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(fx, fy, fr, 0, Math.PI * 2);
            const foodGrad = ctx.createRadialGradient(fx - fr * 0.2, fy - fr * 0.2, 0, fx, fy, fr);
            foodGrad.addColorStop(0, '#ff9ff3');
            foodGrad.addColorStop(0.6, '#fd79a8');
            foodGrad.addColorStop(1, '#e84393');
            ctx.fillStyle = foodGrad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(fx - fr * 0.2, fy - fr * 0.3, fr * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            // Snake
            const len = snake.length;
            if (len === 0) return;

            const hist = headHistory;
            const histLen = hist.length;

            for (let i = 0; i < len; i++) {
                const idx = histLen - 1 - i;
                let pos;
                if (idx >= 0 && idx + 1 < histLen) {
                    const p0 = hist[idx];
                    const p1 = hist[idx + 1];
                    pos = {
                        x: p0.x + (p1.x - p0.x) * progress,
                        y: p0.y + (p1.y - p0.y) * progress
                    };
                } else if (idx >= 0 && idx < histLen) {
                    pos = hist[idx];
                } else {
                    pos = hist[histLen - 1] || { x: snake[0].x * CELL_SIZE + CELL_SIZE / 2, y: snake[0].y * CELL_SIZE +
                            CELL_SIZE / 2 };
                }

                const cx = pos.x;
                const cy = pos.y;
                const t = len > 1 ? i / (len - 1) : 0;
                const size = CELL_SIZE * 0.85 * (1 - t * 0.15);

                const r1 = 108,
                    g1 = 92,
                    b1 = 231;
                const r2 = 0,
                    g2 = 206,
                    b2 = 201;
                const r3 = 253,
                    g3 = 121,
                    b3 = 168;
                let r, g, b;
                if (t < 0.5) {
                    const u = t / 0.5;
                    r = r1 + (r2 - r1) * u;
                    g = g1 + (g2 - g1) * u;
                    b = b1 + (b2 - b1) * u;
                } else {
                    const u = (t - 0.5) / 0.5;
                    r = r2 + (r3 - r2) * u;
                    g = g2 + (g3 - g2) * u;
                    b = b2 + (b3 - b2) * u;
                }

                const alpha = 0.7 + 0.3 * (1 - t);
                ctx.shadowColor = `rgba(${r|0},${g|0},${b|0},0.4)`;
                ctx.shadowBlur = i === 0 ? 25 : 12;

                const half = size / 2;
                const radius = size * 0.28;
                const x = cx - half;
                const y = cy - half;

                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + size - radius, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
                ctx.lineTo(x + size, y + size - radius);
                ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
                ctx.lineTo(x + radius, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();

                const segGrad = ctx.createRadialGradient(cx - half * 0.2, cy - half * 0.2, 0, cx, cy, half);
                segGrad.addColorStop(0, `rgba(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)},${alpha})`);
                segGrad.addColorStop(0.7, `rgba(${r|0},${g|0},${b|0},${alpha})`);
                segGrad.addColorStop(1, `rgba(${Math.max(0,r-40)|0},${Math.max(0,g-40)|0},${Math.max(0,b-40)|0},${alpha*0.9})`);
                ctx.fillStyle = segGrad;
                ctx.fill();
                ctx.shadowBlur = 0;

                if (i === 0) {
                    const eyeSize = size * 0.14;
                    let ex1, ey1, ex2, ey2;
                    const offset = size * 0.22;
                    const d = direction;
                    if (d.dx === 1) {
                        ex1 = cx + offset;
                        ey1 = cy - offset * 0.6;
                        ex2 = cx + offset;
                        ey2 = cy + offset * 0.6;
                    } else if (d.dx === -1) {
                        ex1 = cx - offset;
                        ey1 = cy - offset * 0.6;
                        ex2 = cx - offset;
                        ey2 = cy + offset * 0.6;
                    } else if (d.dy === -1) {
                        ex1 = cx - offset * 0.6;
                        ey1 = cy - offset;
                        ex2 = cx + offset * 0.6;
                        ey2 = cy - offset;
                    } else {
                        ex1 = cx - offset * 0.6;
                        ey1 = cy + offset;
                        ex2 = cx + offset * 0.6;
                        ey2 = cy + offset;
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(10,10,20,0.8)';
                    ctx.beginPath();
                    ctx.arc(ex1 + d.dx * eyeSize * 0.4, ey1 + d.dy * eyeSize * 0.4, eyeSize * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2 + d.dx * eyeSize * 0.4, ey2 + d.dy * eyeSize * 0.4, eyeSize * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function gameLoop(timestamp) {
            if (!gameRunning && !isGameOver) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (!isGameOver && !shatterActive) {
                accumulator += delta;
                while (accumulator >= stepInterval) {
                    updateGame();
                    accumulator -= stepInterval;
                    if (isGameOver) break;
                }
                const progress = Math.min(accumulator / stepInterval, 1);
                draw(progress);
            } else {
                draw(0);
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver(win = false) {
            if (isGameOver) return;
            isGameOver = true;
            gameRunning = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonSnakeHigh', String(highScore));
                highScoreDisplay.textContent = highScore;
            }

            saveTotalTime();

            finalScoreEl.innerHTML = `${score} <small>очков</small>`;
            triggerShatter(() => {
                gameOverlay.style.display = 'flex';
                void gameOverlay.offsetWidth;
                gameOverlay.classList.add('show');
            });
        }

        let shatterParticles = [];
        let shatterAnimId = null;

        function triggerShatter(callback) {
            if (shatterActive) return;
            shatterActive = true;
            shatterCanvas.classList.add('active');
            shatterCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const particles = [];
            const colors = ['#6c5ce7', '#00cec9', '#fd79a8', '#a29bfe', '#55efc4', '#ffeaa7', '#fab1a0', '#74b9ff'];

            const len = snake.length;
            const hist = headHistory;
            const histLen = hist.length;
            for (let i = 0; i < len; i++) {
                const idx = histLen - 1 - i;
                let pos;
                if (idx >= 0 && idx < histLen) {
                    pos = hist[idx];
                } else {
                    pos = hist[histLen - 1] || { x: snake[0].x * CELL_SIZE + CELL_SIZE / 2, y: snake[0].y * CELL_SIZE +
                            CELL_SIZE / 2 };
                }
                const cx = pos.x;
                const cy = pos.y;
                const count = 6 + Math.floor(Math.random() * 8);
                for (let j = 0; j < count; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 8;
                    const size = 3 + Math.random() * 10;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push({
                        x: cx + (Math.random() - 0.5) * CELL_SIZE * 0.5,
                        y: cy + (Math.random() - 0.5) * CELL_SIZE * 0.5,
                        vx: Math.cos(angle) * speed * (0.5 + Math.random() * 0.8),
                        vy: Math.sin(angle) * speed * (0.5 + Math.random() * 0.8) - 1.5,
                        size: size,
                        color: color,
                        life: 1,
                        decay: 0.006 + Math.random() * 0.012,
                        gravity: 0.08,
                        rotation: (Math.random() - 0.5) * 0.2,
                        rotSpeed: (Math.random() - 0.5) * 0.15,
                    });
                }
            }
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 12;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push({
                    x: 250 + (Math.random() - 0.5) * 80,
                    y: 250 + (Math.random() - 0.5) * 80,
                    vx: Math.cos(angle) * speed * (0.3 + Math.random() * 0.7),
                    vy: Math.sin(angle) * speed * (0.3 + Math.random() * 0.7) - 2,
                    size: 2 + Math.random() * 8,
                    color: color,
                    life: 1,
                    decay: 0.004 + Math.random() * 0.01,
                    gravity: 0.06,
                    rotation: (Math.random() - 0.5) * 0.25,
                    rotSpeed: (Math.random() - 0.5) * 0.2,
                });
            }

            shatterParticles = particles;
            const startTime = performance.now();

            function animateShatter(time) {
                const dt = Math.min((time - startTime) / 1000, 0.05);
                shatterCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                let alive = false;
                for (const p of shatterParticles) {
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.vy += p.gravity * dt * 60;
                    p.vx *= 0.995;
                    p.vy *= 0.995;
                    p.life -= p.decay * dt * 60;
                    p.rotation += p.rotSpeed * dt * 60;
                    if (p.life > 0) alive = true;

                    const alpha = Math.max(0, p.life);
                    const s = p.size * (0.3 + 0.7 * alpha);

                    shatterCtx.save();
                    shatterCtx.translate(p.x, p.y);
                    shatterCtx.rotate(p.rotation);
                    shatterCtx.globalAlpha = alpha * 0.9;
                    shatterCtx.shadowColor = p.color;
                    shatterCtx.shadowBlur = 15;

                    const corners = 4 + Math.floor(Math.random() * 2);
                    shatterCtx.beginPath();
                    for (let i = 0; i < corners; i++) {
                        const a = (i / corners) * Math.PI * 2;
                        const r = s * (0.5 + 0.5 * Math.sin(i * 1.7 + p.rotation));
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (i === 0) shatterCtx.moveTo(px, py);
                        else shatterCtx.lineTo(px, py);
                    }
                    shatterCtx.closePath();
                    shatterCtx.fillStyle = p.color;
                    shatterCtx.fill();
                    shatterCtx.shadowBlur = 0;
                    shatterCtx.restore();
                }

                if (alive) {
                    shatterAnimId = requestAnimationFrame(animateShatter);
                } else {
                    shatterActive = false;
                    shatterCanvas.classList.remove('active');
                    shatterCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    if (callback) callback();
                }
            }
            if (shatterAnimId) cancelAnimationFrame(shatterAnimId);
            shatterAnimId = requestAnimationFrame(animateShatter);
        }

        // ===== INPUT =====
        function setDirection(dx, dy) {
            if (!gameRunning || isGameOver || shatterActive) return;
            if ((dx !== 0 || dy !== 0) &&
                (dx !== -direction.dx || dy !== -direction.dy)) {
                nextDirection = { dx, dy };
            }
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            e.preventDefault();

            // Английские и русские клавиши
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === 'ц' || key === 'Ц') {
                setDirection(0, -1);
            } else if (key === 'ArrowDown' || key === 's' || key === 'S' || key === 'ы' || key === 'Ы') {
                setDirection(0, 1);
            } else if (key === 'ArrowLeft' || key === 'a' || key === 'A' || key === 'ф' || key === 'Ф') {
                setDirection(-1, 0);
            } else if (key === 'ArrowRight' || key === 'd' || key === 'D' || key === 'в' || key === 'В') {
                setDirection(1, 0);
            } else if (key === 'r' || key === 'R') {
                if (isGameOver) initGame();
            }
        });

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const dx = parseInt(btn.dataset.dx);
                const dy = parseInt(btn.dataset.dy);
                setDirection(dx, dy);
            });
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dx = parseInt(btn.dataset.dx);
                const dy = parseInt(btn.dataset.dy);
                setDirection(dx, dy);
            }, { passive: false });
        });

        // Свайпы
        let touchStartX = 0,
            touchStartY = 0;
        let isTouching = false;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = t.clientX - rect.left;
            touchStartY = t.clientY - rect.top;
            isTouching = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isTouching || isGameOver || shatterActive) return;
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = t.clientX - rect.left;
            const y = t.clientY - rect.top;
            const dx = x - touchStartX;
            const dy = y - touchStartY;
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                setDirection(dx > 0 ? 1 : -1, 0);
            } else {
                setDirection(0, dy > 0 ? 1 : -1);
            }
            touchStartX = x;
            touchStartY = y;
        }, { passive: false });

        canvas.addEventListener('touchend', () => { isTouching = false; }, { passive: true });

        playAgainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (shatterActive) return;
            initGame();
        });
        restartBtn.addEventListener('click', () => {
            if (shatterActive) return;
            initGame();
        });

        // ===== START =====
        highScoreDisplay.textContent = highScore;
        initGame();

        function resizeGameCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.floor(rect.width - 10);
            const dim = Math.min(size, 560);
            canvas.style.width = dim + 'px';
            canvas.style.height = dim + 'px';
            shatterCanvas.style.width = dim + 'px';
            shatterCanvas.style.height = dim + 'px';
        }
        window.addEventListener('resize', resizeGameCanvas);
        resizeGameCanvas();

        console.log('🐍 Неоновая Змейка · Управление: стрелки / WASD / ЦФЫВ / свайп');
        console.log('🏆 Достижения: 30 → "Змеиный укус", 150 → "Удав"');
        console.log('⏱️ Время игры сохраняется в профиль');
    </script>
</body>
</html>
