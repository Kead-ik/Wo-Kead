<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Только для лучшей ГВ ❤</title>
  
  <!-- Иконка с белым сердечком (SVG встроено прямо в код) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #ffffff;
      --accent-color: #8b5cf6;
      --accent-hover: #7c3aed;
      --cell-bg: #334155;
      --cell-hover: #475569;
      --cell-copied: #1e293b;
      --text-copied: #64748b;
      --border-copied: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-section {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 100px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--accent-color);
      border-color: transparent;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-container {
      display: flex;
      gap: 12px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.clear-btn {
      background-color: #475569;
    }

    button.clear-btn:hover {
      background-color: #64748b;
    }

    button.fixes-btn {
      background-color: #0284c7;
    }

    button.fixes-btn:hover {
      background-color: #0369a1;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spellcheck-option {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .spellcheck-option input {
      cursor: pointer;
    }

    .link-word-input {
      width: 130px;
      height: 38px;
      background-color: rgba(15, 23, 42, 0.6);
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 12px;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .link-word-input:focus {
      outline: none;
      border-color: var(--accent-color);
      color: #ffffff;
      background-color: var(--bg-color);
    }

    .table-wrapper {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
    }

    tr {
      height: 23px;
    }

    td {
      height: 23px;
      line-height: 23px;
      padding: 0 12px;
      background-color: var(--cell-bg);
      color: #ffffff;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-size: 13px;
      box-sizing: border-box;
      border: 1px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td:hover {
      background-color: var(--cell-hover);
    }

    td a.table-link {
      color: #ffffff;
      text-decoration: underline;
      pointer-events: none;
    }

    td.copied {
      background-color: var(--cell-copied);
      color: var(--text-copied);
      border-color: var(--border-copied);
      opacity: 0.5;
    }

    td.copied a.table-link {
      color: var(--text-copied);
    }

    td.copied:hover {
      opacity: 0.7;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 80vh;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .fix-item {
      background-color: var(--bg-color);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .fix-from {
      color: #f87171;
      text-decoration: line-through;
    }

    .fix-arrow {
      color: #64748b;
      margin: 0 10px;
    }

    .fix-to {
      color: #4ade80;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--accent-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="input-section">
    <label for="pasteArea">Вставьте ячейки из Google Таблиц (Ctrl+V):</label>
    <textarea id="pasteArea" placeholder="Вставьте скопированные данные..."></textarea>
    
    <div class="bottom-bar">
      <div class="btn-container">
        <button id="parseBtn" onclick="parseTable()">Построить таблицу</button>
        <button class="clear-btn" onclick="clearAll()">Очистить всё</button>
        <button id="fixesBtn" class="fixes-btn" onclick="openModal()" style="display: none;">Список исправлений (0)</button>
      </div>

      <div class="right-controls">
        <label class="spellcheck-option">
          <input type="checkbox" id="spellcheckToggle" checked> Автопроверка ошибок
        </label>
        <input type="text" id="linkWord" class="link-word-input" value="Клик" placeholder="Текст ссылки">
      </div>
    </div>
  </div>

  <div class="table-wrapper" id="tableWrapper" style="display: none;">
    <table id="outputTable"></table>
  </div>
</div>

<div class="modal-overlay" id="fixesModal">
  <div class="modal-card">
    <div class="modal-header">
      <span>Исправленные ошибки</span>
      <button class="clear-btn" style="padding: 4px 12px; font-size: 12px;" onclick="closeModal()">Закрыть</button>
    </div>
    <div class="modal-body" id="modalList"></div>
  </div>
</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
  let lastFixes = [];

  async function checkOrtho(text) {
    try {
      const preserved = [];
      let maskedText = text;

      function maskMatch(match) {
        preserved.push(match);
        return `XPMASK${preserved.length - 1}XP`;
      }

      function maskIfBoundary(match, offset, string) {
        const prevChar = string[offset - 1];
        const nextChar = string[offset + match.length];
        const isWordChar = /[а-яА-ЯёЁa-zA-Z0-9_]/;
        
        if ((!prevChar || !isWordChar.test(prevChar)) && (!nextChar || !isWordChar.test(nextChar))) {
          return maskMatch(match);
        }
        return match;
      }

      maskedText = maskedText.replace(/https?:\/\/[^\s]+/gi, maskMatch);
      maskedText = maskedText.replace(/\b\d{1,4}[./-]\d{1,2}[./-]\d{1,4}\b/g, maskMatch);
      maskedText = maskedText.replace(/\b[A-Za-z0-9]+(?:_[A-Za-z0-9]+)+\b/g, maskMatch);
      
      maskedText = maskedText.replace(/МП\s*\(\s*Ф\s*\)/gi, maskIfBoundary);
      maskedText = maskedText.replace(/ЛЦТР|МПдГ|Собесы|Собес|СоМП|ФГМП|ГМП|МП/gi, maskIfBoundary);
      maskedText = maskedText.replace(/[ЛТ]/gi, maskIfBoundary);

      const response = await fetch('https://speller.yandex.net/services/spellservice.json/checkText', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'options=6&text=' + encodeURIComponent(maskedText)
      });
      
      const errors = await response.json();
      
      let correctedText = maskedText;
      const fixes = [];

      for (let i = errors.length - 1; i >= 0; i--) {
        const err = errors[i];
        
        if (err.word && err.word.includes('XPMASK')) continue;

        if (err.s && err.s.length > 0) {
          const originalWord = err.word;
          const replacement = err.s[0];

          const before = correctedText.slice(0, err.pos);
          const after = correctedText.slice(err.pos + err.len);
          correctedText = before + replacement + after;

          fixes.unshift({ from: originalWord, to: replacement });
        }
      }

      for (let i = 0; i < preserved.length; i++) {
        correctedText = correctedText.replace(`XPMASK${i}XP`, preserved[i]);
      }

      return { text: correctedText, fixes: fixes };
    } catch (e) {
      console.error("Speller error:", e);
      return { text: text, fixes: [] };
    }
  }

  async function parseTable() {
    const rawData = document.getElementById('pasteArea').value;
    const linkWordInput = document.getElementById('linkWord').value.trim() || 'Клик';
    const enableSpellcheck = document.getElementById('spellcheckToggle').checked;
    const tableContainer = document.getElementById('tableWrapper');
    const table = document.getElementById('outputTable');
    const parseBtn = document.getElementById('parseBtn');
    const fixesBtn = document.getElementById('fixesBtn');

    if (!rawData.trim()) {
      tableContainer.style.display = 'none';
      fixesBtn.style.display = 'none';
      return;
    }

    parseBtn.disabled = true;
    parseBtn.textContent = 'Обработка...';

    table.innerHTML = '';
    lastFixes = [];
    fixesBtn.style.display = 'none';

    let textToProcess = rawData.trim();

    if (enableSpellcheck) {
      const orthoResult = await checkOrtho(textToProcess);
      textToProcess = orthoResult.text;
      lastFixes = orthoResult.fixes;
    }

    const rows = textToProcess.split(/\r?\n/);

    rows.forEach(rowText => {
      const tr = document.createElement('tr');
      const cells = rowText.split('\t');

      cells.forEach(cellText => {
        const td = document.createElement('td');
        let cleanText = cellText.trim();

        const isUrl = /^https?:\/\/[^\s]+$/i.test(cleanText);

        if (!isUrl && cleanText.length > 0) {
          cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
        }

        if (isUrl) {
          td.innerHTML = `<a class="table-link" href="${cleanText}">${linkWordInput}</a>`;
        } else {
          td.textContent = cleanText;
        }

        td.addEventListener('click', () => {
          if (!cleanText) return;

          if (isUrl) {
            // Новый, более надежный метод копирования "чистой" ссылки без лишних стилей
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.innerHTML = `<a href="${cleanText}">${linkWordInput}</a>`;
            document.body.appendChild(tempDiv);

            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(tempDiv);
            selection.removeAllRanges();
            selection.addRange(range);

            try {
              document.execCommand('copy');
              td.classList.add('copied');
              showToast('Скопировано!');
            } catch (err) {
              console.error('Ошибка копирования:', err);
              // Если вдруг старый метод не сработал, копируем хотя бы текстом
              navigator.clipboard.writeText(cleanText);
            }

            selection.removeAllRanges();
            document.body.removeChild(tempDiv);
          } else {
            navigator.clipboard.writeText(cleanText).then(() => {
              td.classList.add('copied');
              showToast('Скопировано!');
            }).catch(err => console.error(err));
          }
        });

        tr.appendChild(td);
      });

      table.appendChild(tr);
    });

    tableContainer.style.display = 'block';
    parseBtn.disabled = false;
    parseBtn.textContent = 'Построить таблицу';

    if (enableSpellcheck && lastFixes.length > 0) {
      fixesBtn.textContent = `Список исправлений (${lastFixes.length})`;
      fixesBtn.style.display = 'inline-block';
      showToast(`Исправлено ошибок: ${lastFixes.length}`);
    }
  }

  function openModal() {
    const modalList = document.getElementById('modalList');
    modalList.innerHTML = '';

    lastFixes.forEach(item => {
      const row = document.createElement('div');
      row.className = 'fix-item';
      row.innerHTML = `
        <span class="fix-from">${item.from}</span>
        <span class="fix-arrow">➔</span>
        <span class="fix-to">${item.to}</span>
      `;
      modalList.appendChild(row);
    });

    document.getElementById('fixesModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('fixesModal').classList.remove('active');
  }

  function clearAll() {
    document.getElementById('pasteArea').value = '';
    document.getElementById('outputTable').innerHTML = '';
    document.getElementById('tableWrapper').style.display = 'none';
    document.getElementById('fixesBtn').style.display = 'none';
    lastFixes = [];
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 1800);
  }

  document.getElementById('fixesModal').addEventListener('click', (e) => {
    if (e.target.id === 'fixesModal') closeModal();
  });
</script>

</body>
</html>
